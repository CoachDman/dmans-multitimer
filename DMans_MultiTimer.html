<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#eef1f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111;overflow-x:hidden}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.top{background:#17395f;padding:5px 8px;position:sticky;top:0;z-index:20}
.title{font-size:15px;font-weight:900;text-align:center;color:white;margin-bottom:4px}
.master{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
button{border:0;border-radius:7px;color:white;font-weight:900;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.master button{height:40px;font-size:13px}
.ma{background:#258548}.ml{background:#2869b2}.ms{background:#c64740}.mr{background:#707b86}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px}
.col{min-width:0}
.runner{height:58px;background:white;border:1px solid #d5dbe1;border-radius:7px;margin-bottom:4px;padding:4px;display:grid;
grid-template-columns:minmax(95px,1.2fr) 86px 43px 58px 43px;grid-template-rows:28px 20px;gap:3px;align-items:center}
.runner.running{background:#e8f7ed;border-color:#4a9d65}
.runner input{min-width:0;width:100%;height:27px;border:0;background:transparent;font-size:13px;font-weight:800;padding:2px 3px}
.time{font-size:21px;font-weight:900;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.runner button{height:29px;padding:0;font-size:12px}
.go{background:#258548;font-size:17px!important}.lap{background:#2869b2}.stop{background:#c64740;font-size:15px!important}
.split{grid-column:1/6;text-align:right;font-size:11px;font-weight:700;color:#5d6872;padding-right:3px;white-space:nowrap}
.note{font-size:10px;text-align:center;color:#66717b;padding:3px}

/* Portrait stays compact; rotate phone for the intended race view */
@media (orientation:portrait){
 .title{font-size:12px}.master button{height:31px;font-size:9px}
 .columns{gap:3px;padding:3px}
 .runner{height:45px;margin-bottom:2px;padding:2px;grid-template-columns:minmax(0,1fr) 52px 25px 34px 25px;grid-template-rows:20px 17px;gap:1px}
 .runner input{height:19px;font-size:8px}.time{font-size:12px}.runner button{height:20px;font-size:8px}
 .go{font-size:11px!important}.stop{font-size:10px!important}.split{font-size:8px}
}
@media (orientation:landscape) and (max-height:500px){
 .top{padding:3px 8px}.title{display:none}.master button{height:34px}
 .columns{padding:4px 7px;gap:7px}
 .runner{height:39px;margin-bottom:2px;padding:2px 4px;grid-template-columns:minmax(105px,1.2fr) 80px 42px 55px 42px;grid-template-rows:31px;gap:4px}
 .runner input{height:30px;font-size:13px}.time{font-size:19px}
 .runner button{height:31px}.split{display:none}
}

<div class="note">▶ start • LAP records split • ■ stop • names save automatically</div>
<script>
(function(){
"use strict";
var N=20, watches=[];
for(var i=0;i<=N;i++) watches.push({running:false,base:0,started:0,lastLap:0,laps:[]});
function clock(){return (window.performance&&performance.now)?performance.now():Date.now();}
function total(i){var x=watches[i];return x.base+(x.running?clock()-x.started:0);}
function fmt(ms){if(ms<0)ms=0;var tenths=Math.floor(ms/100),d=tenths%10,secs=Math.floor(tenths/10),s=secs%60,m=Math.floor(secs/60);return m+":"+("0"+s).slice(-2)+"."+d;}
function draw(i){document.getElementById("t"+i).textContent=fmt(total(i));document.getElementById("r"+i).className="runner"+(watches[i].running?" running":"");}
function start(i){var x=watches[i];if(!x.running){x.started=clock();x.running=true;draw(i);}}
function stop(i){var x=watches[i];if(x.running){x.base+=clock()-x.started;x.running=false;draw(i);}}
function lap(i){var x=watches[i];if(!x.running)return;var t=total(i),sp=t-x.lastLap;x.lastLap=t;x.laps.push([sp,t]);document.getElementById("s"+i).textContent="Lap "+x.laps.length+": "+fmt(sp)+"  •  "+fmt(t);}
function reset(i){watches[i]={running:false,base:0,started:0,lastLap:0,laps:[]};document.getElementById("s"+i).textContent="—";draw(i);}
document.addEventListener("click",function(e){
 var b=e.target.closest?e.target.closest("button"):e.target;
 if(!b||b.tagName!=="BUTTON")return;
 e.preventDefault();
 var a=b.getAttribute("data-action"), idx=parseInt(b.getAttribute("data-i"),10);
 if(a&&idx){if(a==="start")start(idx);else if(a==="lap")lap(idx);else if(a==="stop")stop(idx);return;}
 var m=b.getAttribute("data-master");
 if(m==="start")for(var j=1;j<=N;j++)start(j);
 else if(m==="lap")for(var j=1;j<=N;j++)lap(j);
 else if(m==="stop")for(var j=1;j<=N;j++)stop(j);
 else if(m==="reset"){if(confirm("Reset all watches and lap data?"))for(var j=1;j<=N;j++)reset(j);}
},false);
for(var k=1;k<=N;k++){(function(i){
 var el=document.getElementById("n"+i);
 try{var saved=localStorage.getItem("runner2col"+i);if(saved)el.value=saved;}catch(e){}
 el.addEventListener("change",function(){try{localStorage.setItem("runner2col"+i,el.value);}catch(e){}});
})(k);}
function tick(){for(var i=1;i<=N;i++)if(watches[i].running)draw(i);(window.requestAnimationFrame||function(f){setTimeout(f,50)})(tick);}
tick();
})();
</script></body></html>
